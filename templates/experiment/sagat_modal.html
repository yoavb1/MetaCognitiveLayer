<div class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4 z-50 font-mono text-xs">
  <div class="bg-[#121824] border border-amber-500/50 rounded-xl p-6 max-w-lg w-full space-y-6 shadow-2xl">

    <div class="border-b border-slate-800 pb-3 flex justify-between items-center">
      <div>
        <span class="text-[10px] text-amber-400 font-bold uppercase tracking-widest block">SYSTEM PAUSED</span>
        <h3 class="text-sm font-bold text-slate-100 uppercase">Situation Awareness Query (SAGAT)</h3>
      </div>
      <span class="bg-amber-950 text-amber-300 border border-amber-800 px-2 py-0.5 rounded text-[10px]">FREEZE PROBE</span>
    </div>

    <form hx-post="{% url 'sagat_query' trial_id|default:1 %}" hx-target="#modal-container" class="space-y-5">
      {% csrf_token %}

      <div class="space-y-2">
        <label class="text-slate-200 block font-bold">1. What was the trajectory of the Reactor Pressure right before the freeze?</label>
        <div class="space-y-1.5 text-slate-400">
          <label class="flex items-center gap-2.5 p-2 bg-[#0b0f17] border border-slate-800 rounded hover:border-slate-700 cursor-pointer">
            <input type="radio" name="sa_q1" value="RISING" required class="accent-sky-500">
            <span>Rising rapidly (> 2,800 kPa)</span>
          </label>
          <label class="flex items-center gap-2.5 p-2 bg-[#0b0f17] border border-slate-800 rounded hover:border-slate-700 cursor-pointer">
            <input type="radio" name="sa_q1" value="STABLE" class="accent-sky-500">
            <span>Nominal / Stable</span>
          </label>
          <label class="flex items-center gap-2.5 p-2 bg-[#0b0f17] border border-slate-800 rounded hover:border-slate-700 cursor-pointer">
            <input type="radio" name="sa_q1" value="FALLING" class="accent-sky-500">
            <span>Falling rapidly</span>
          </label>
        </div>
      </div>

      <div class="space-y-2">
        <label class="text-slate-200 block font-bold">2. Which physical plant unit currently holds the highest alarm density?</label>
        <div class="space-y-1.5 text-slate-400">
          <label class="flex items-center gap-2.5 p-2 bg-[#0b0f17] border border-slate-800 rounded hover:border-slate-700 cursor-pointer">
            <input type="radio" name="sa_q2" value="REACTOR" required class="accent-sky-500">
            <span>Reactor Unit</span>
          </label>
          <label class="flex items-center gap-2.5 p-2 bg-[#0b0f17] border border-slate-800 rounded hover:border-slate-700 cursor-pointer">
            <input type="radio" name="sa_q2" value="CONDENSER" class="accent-sky-500">
            <span>Condenser Cooling Loop</span>
          </label>
          <label class="flex items-center gap-2.5 p-2 bg-[#0b0f17] border border-slate-800 rounded hover:border-slate-700 cursor-pointer">
            <input type="radio" name="sa_q2" value="STRIPPER" class="accent-sky-500">
            <span>Product Stripper</span>
          </label>
        </div>
      </div>

      <button type="submit" class="w-full bg-sky-600 hover:bg-sky-500 text-white font-bold py-2.5 rounded transition-all mt-4">
        SUBMIT RESPONSES & RESUME TRIAL
      </button>
    </form>
  </div>
</div>
